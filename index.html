<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800&display=swap"></noscript>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3EDE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="barra">
<link rel="apple-touch-icon" href="icons/logo.png">
<style>
/* Layout: una columna de móvil (440px máx.) sobre beige cálido; tarjetas crema con sombra difusa; dock fijo abajo.
   Un solo tema claro y cálido, elegido a propósito (salvia + verde bosque + marrón grisáceo). */
:root{
  --outside:#EAE2D3; --bg:#F3EDE2; --surface:#FBF8F2; --ink:#2F4A3A; --ink2:#6A6054; --muted:#74695D;
  --line:#ECE4D6; --accent:#7A9A6B; --accent-dark:#5B7A4E; --accent-ink:#FFFFFF; --tint:#DDE7D3; --soft:#CFDDC4;
  --v0:#D3E0C8; --v1:#A9C29B; --v2:#7A9A6B; --v3:#4F6B45; --danger:#B5543C;
  --shadow:0 1px 2px rgba(110,90,55,.05),0 12px 30px -8px rgba(110,90,55,.14);
  --f-display:"Fredoka", "Nunito", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-padding-bottom:calc(var(--dock-h, 180px) + 16px);scroll-padding-top:8px}
body{background:var(--outside);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,a,input,textarea,summary,label{touch-action:manipulation}
body.lock{position:fixed;width:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--dock-h, 180px) + 28px);
  display:flex;flex-direction:column;gap:18px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:center;padding-block:20px 0}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1;color:var(--ink)}
.logo img{width:44px;height:auto;display:block;filter:drop-shadow(0 4px 6px rgba(110,90,55,.15))}
.top-date{font-size:14px;color:var(--ink2);font-weight:600}

.eyebrow{margin:0;font-size:15px;color:var(--ink2);font-weight:600}
.display{margin:0;font-family:var(--f-display);font-weight:600;font-size:54px;line-height:1;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--ink)}
.head{display:flex;flex-direction:column;gap:8px;padding-top:8px;position:relative}
.head-work{gap:2px;padding-top:0}
.head-work .display{font-size:34px}
.head-work .kpis{margin-top:2px}
.head-work .kpis b{font-size:24px}
.head-work .sitter{width:68px;height:84px}
.head:has(> .i3) .display{padding-right:96px}
.kpis{display:flex;gap:20px;margin-top:8px;align-items:flex-end}
.kpis div{display:flex;flex-direction:column;gap:2px}
.kpis b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
.kpis span{font-size:13.5px;color:var(--ink2);font-weight:600}

.card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.group{position:relative}
.group header{display:flex;align-items:center;gap:12px}
.thumb{width:54px;height:54px;border-radius:18px;background:var(--tint);display:grid;place-items:center;flex:none;overflow:hidden}
.gt{flex:1;min-width:0}
.gt h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.gt p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--soft);color:var(--accent-dark);flex:none}
.icon-btn:active{background:var(--tint)}
.sets{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.set{width:100%;display:grid;grid-template-columns:24px 1fr auto auto;align-items:center;gap:10px;min-height:56px;padding:6px 4px;border-top:1.5px solid var(--line);text-align:left;border-radius:14px}
.sn{font-size:13px;color:var(--muted);font-weight:700}
.sv b{font-family:var(--f-display);font-size:clamp(22px,8vw,30px);font-weight:600}
.sv small{font-size:14px;color:var(--ink2);margin-left:4px;font-weight:600}
.tag{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--tint);color:var(--ink);white-space:nowrap}
.rpe{font-size:12.5px;color:var(--ink2);min-width:48px;text-align:right;font-weight:600}
.rpe b{color:var(--ink);font-size:14px}
.last{margin:6px 0 0;padding-top:12px;border-top:1.5px dashed var(--line);font-size:13.5px;color:var(--ink2)}
.last b{color:var(--ink)}
.fresh{animation:fresh 1s ease-out}
@keyframes fresh{from{background:var(--tint)}to{background:transparent}}

.note label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.note textarea{width:100%;border:0;resize:none;background:transparent;font:inherit;font-size:16px;color:var(--ink);min-height:48px;padding:0}
.note textarea::placeholder{color:var(--muted)}
.empty{text-align:center;padding:30px 18px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty p{margin:0}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:19px;margin-bottom:4px}

.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:5;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--bg) 28px)}
.dock::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:36px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.fab-wrap{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(100% - 4px);width:auto;left:auto;padding:0;background:none;pointer-events:none}
.fab-wrap .primary{width:56px;height:56px;padding:0;font-size:0;gap:0;pointer-events:auto}
.fab-wrap .primary .ic{width:26px;height:26px}
.primary{width:100%;height:56px;border-radius:999px;background:var(--accent-dark);color:var(--accent-ink);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 22px -8px rgba(91,122,78,.65)}
.primary:active{transform:scale(.985)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);box-shadow:0 -8px 24px -12px rgba(110,90,55,.18);border-radius:24px 24px 0 0;pointer-events:auto;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:999px}
.tab[aria-current="page"]{color:var(--accent-dark)}
.tab .fill{fill:currentColor;fill-opacity:0;stroke:none}
.tab[aria-current="page"] .fill{fill-opacity:.25}

/* Dos fotogramas clay (a/b) en bucle sobre verde claro: el "GIF" propio de cada ejercicio */
.art{position:relative;display:block;width:100%;aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:inherit;background:var(--tint)}
.art img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
/* Corte seco entre fotogramas: nunca hay dos visibles a la vez (los PNG transparentes se transparentarían) */
/* solo alterna si hay segundo fotograma; con uno solo, la imagen queda fija */
.art img:first-child:not(:only-child){animation:frame-a 2.4s steps(1,end) infinite}
.art .peak{opacity:0;animation:frame-b 2.4s steps(1,end) infinite}
@keyframes frame-a{0%{opacity:1}50%{opacity:0}}
@keyframes frame-b{0%{opacity:0}50%{opacity:1}}
.credit{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}
.credit a{color:var(--ink2)}

/* Biblioteca */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ex-card{display:flex;flex-direction:column;gap:10px;padding:8px 8px 16px;text-align:left}
.ex-card .pic{border-radius:18px;overflow:hidden}
.ex-card h3{margin:0 6px;font-family:var(--f-display);font-size:17px;font-weight:600}
.ex-card p{margin:2px 6px 0;font-size:13px;color:var(--ink2)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--ink2);height:44px;margin-top:8px}
.hero-pic{border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
a.exrx{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:12px;padding:12px 16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent-dark);color:var(--accent-dark);font-weight:800;text-decoration:none;text-align:center}
.exrx-note{margin:8px 2px 0;font-size:13.5px;line-height:1.4;color:var(--ink2);font-weight:700}
.prog .vb{display:contents;text-align:left}
.prog li[data-act]{cursor:pointer}
.prog li.sel .vn{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.prog li:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.cue{margin:0;font-size:16px;line-height:1.6;color:var(--ink);max-width:60ch}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prog li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;min-height:54px;position:relative}
.prog li:not(:last-child)::after{content:"";position:absolute;left:14px;top:38px;bottom:-16px;width:2px;border-radius:2px;background:var(--line)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;background:var(--surface);z-index:1}
.dot .ic{width:15px;height:15px;stroke-width:2.6}
.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.cur .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--tint)}
.cur .dot::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent)}
.prog .vn{font-weight:700}
.next .vn{color:var(--muted)}
.here{font-size:12.5px;font-weight:800;color:var(--ink);background:var(--tint);padding:4px 10px;border-radius:999px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ghost{height:54px;border-radius:999px;border:1.5px solid var(--soft);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);color:var(--ink)}

/* Progreso */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none;min-width:0;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--soft);font-size:14.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-dark);color:var(--accent-ink);border-color:var(--accent-dark)}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.compare .k{font-size:13px;color:var(--ink2);font-weight:700}
.compare b{display:block;font-family:var(--f-display);font-size:clamp(28px,11vw,46px);font-weight:600;line-height:1;margin:6px 0 8px;overflow-wrap:anywhere}
.compare b small{font-size:16px;font-family:var(--f-body);font-weight:700;color:var(--ink2);margin-left:4px}
.compare .arrow{color:var(--accent);padding-bottom:34px}
.readout{font-size:14px;color:var(--ink2);min-height:20px;margin:0}
.readout b{color:var(--ink)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px;font-weight:600}
.chart .lbl{fill:var(--ink);font-weight:700}
.chart .grid-l{stroke:var(--line);stroke-width:1.2}
.chart .mark{stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.delta{margin:0;font-size:14px;font-weight:700;color:var(--ink2)}
.delta b{color:var(--ink)}
.hist-sets{display:flex;flex-direction:column;gap:8px;padding:0 18px 16px}
.hist-set{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border-top:1.5px solid var(--line);padding:10px 2px;min-height:48px;border-radius:12px}
.hist-set span{color:var(--ink2);text-align:right}
.file-btn{align-self:center;font-size:13px;font-weight:800;color:var(--accent-dark);padding:8px 12px;min-height:44px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%}

/* Historial */
.week{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.week span{font-size:13.5px;color:var(--ink2);font-weight:600}
.hist{padding:0;overflow:hidden}
.hist summary{list-style:none;display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:16px 18px;cursor:pointer;align-items:start}
.hist summary::-webkit-details-marker{display:none}
.dd{display:flex;flex-direction:column;align-items:flex-start}
.dd b{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1}
.dd span{font-size:13px;color:var(--ink2);font-weight:700}
.sum{font-size:14px;color:var(--ink2);line-height:1.5;min-width:0;overflow-wrap:anywhere}
.sum strong{color:var(--ink);font-weight:700}
.sum em{display:block;margin-top:6px;color:var(--ink);font-style:italic}
.count{font-size:12.5px;font-weight:800;background:var(--tint);color:var(--ink);border-radius:999px;padding:5px 10px;white-space:nowrap}
.hist-detail{padding:0 18px 16px 82px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist-detail div{display:flex;justify-content:space-between;gap:10px;border-top:1.5px solid var(--line);padding-top:8px}
.hist-detail span{color:var(--ink2);text-align:right}
.wipe{align-self:center;font-size:13px;color:var(--ink2);text-decoration:underline;padding:12px}
.wipe.armed{color:var(--danger);font-weight:800}

/* Hoja de registro */
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet.on{visibility:visible}
.backdrop{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);opacity:0;transition:opacity .2s}
.sheet.on .backdrop{opacity:1}
.panel{position:absolute;bottom:0;left:50%;width:min(440px,100%);max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:30px 30px 0 0;min-width:0;
  transform:translate(-50%,100%);transition:transform .3s cubic-bezier(.2,.9,.25,1.05);
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:20px}
.sheet.on .panel{transform:translate(-50%,0)}
.panel>*{min-width:0;max-width:100%}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
/* Cabecera fija del formulario con botón de cerrar, visible aunque el formulario ocupe toda la pantalla */
.sheet-top{position:sticky;top:-12px;z-index:2;display:flex;align-items:center;justify-content:center;min-height:48px;margin:-12px -18px -12px;padding:8px 18px 0;border-radius:30px 30px 0 0;background:var(--surface)}
.sheet-x{position:absolute;right:14px;top:8px;width:44px;height:44px;border-radius:999px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.sheet-x .ic{width:20px;height:20px;stroke-width:2.6}
.hint{margin:0;font-size:14px;color:var(--ink2);background:var(--bg);border-radius:18px;padding:12px 14px}
.hint b{color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:44px;padding:0 16px;border-radius:999px;background:var(--bg);font-weight:700;font-size:14.5px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--tint);box-shadow:inset 0 0 0 2px var(--accent)}
.lab{font-size:14px;color:var(--ink2);font-weight:700;margin:0 0 10px}
.stepper{display:grid;grid-template-columns:68px 1fr 68px;align-items:center;gap:8px}
.stepper>button{height:68px;border-radius:50%;background:var(--surface);border:1.5px solid var(--soft);display:grid;place-items:center;color:var(--accent-dark)}
.stepper>button:active{background:var(--tint)}
.stepper .ic{width:28px;height:28px;stroke-width:2.4}
.valbox{text-align:center}
.valbox input{width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-weight:600;font-size:clamp(40px,16vw,72px);line-height:1;color:var(--ink);padding:0;-moz-appearance:textfield}
.valbox input::-webkit-inner-spin-button,.valbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.valbox span{font-size:14px;color:var(--ink2);font-weight:600}
.timer{display:flex;align-items:center;gap:12px}
.timer button{height:48px;padding:0 18px;border-radius:999px;background:var(--tint);color:var(--ink);font-weight:800;display:flex;align-items:center;gap:6px;flex:none}
.timer.run button{background:var(--accent-dark);color:var(--accent-ink)}
.bar{flex:1;height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s linear}
.timer small{font-size:12.5px;color:var(--ink2);white-space:nowrap;font-weight:600}
.rpes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-width:0}
.rpes button{height:48px;border-radius:16px;background:var(--bg);font-weight:800;font-size:16px;color:var(--ink)}
.rpes button[aria-pressed="true"]{background:var(--accent-dark);color:var(--accent-ink)}
.danger{height:48px;color:var(--danger);font-weight:800;border-radius:999px}
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h, 158px) + 12px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--surface);
  padding:8px 14px;border-radius:22px;font-size:14.5px;font-weight:700;transition:.3s;z-index:30;pointer-events:none;max-width:min(360px,calc(100% - 24px));display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.can-undo{pointer-events:auto}
.toast button{color:#F4F7EF;font-weight:800;padding:8px 10px;min-height:44px;text-decoration:underline;flex:none}
.sheet.on ~ .toast.on{top:max(12px, env(safe-area-inset-top));bottom:auto}
.sheet.on ~ .cheer{visibility:hidden!important;opacity:0!important}

/* Iconos 3D (3dicons, clay CC0, recortados y teñidos en pastel) */
.i3{display:block;pointer-events:none;user-select:none;filter:drop-shadow(0 10px 14px rgba(110,90,55,.16))}
.head>.i3{position:absolute;right:0;top:4px;width:92px;transform:rotate(-14deg);animation:float-tilt 6s ease-in-out infinite}
.head>.i3~.eyebrow{padding-right:100px}
@keyframes float-tilt{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-6px) rotate(-10deg)}}
.note label .i3{width:28px;margin:-6px 0}
.toast .i3{width:28px;margin:-6px 0;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:scale(1)}}
.timer .i3{width:42px;margin:-6px -4px}
.timer.run .i3{animation:ring .5s ease-in-out infinite}

.cheer{position:fixed;left:50%;bottom:calc(258px + env(safe-area-inset-bottom,0px));width:116px;height:166px;margin-left:-58px;z-index:31;pointer-events:none;opacity:0;visibility:hidden}

  42%{transform:translateY(-8px)}54%{transform:translateY(0)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}

function clampVal(n){n=Math.round(Number(n));if(!Number.isFinite(n)||n<0)n=0;return Math.min(999,n)}

// Valor que se anota al marcar la casilla. Los minutos (2') de un ejercicio en segundos pasan a segundos.
function parseTarget(id,raw){
  const e=EXM[id]; if(!e) return null;
  const s=String(raw??'');
  if(e.u==='series'||/amrap/i.test(s)) return null;
  if(e.type==='time'){
    const sec=s.match(/(\d+)\s*(?:-\s*\d+)?\s*["″]/);
    if(sec) return +sec[1];
    const mn=s.match(/(\d+(?:[.,]\d+)?)\s*['′]/);
    if(mn) return Math.round(parseFloat(mn[1].replace(',','.'))*60);
    const n=s.match(/\d+/); return n?+n[0]:null;
  }
  if(e.type==='min'){
    const mn=s.match(/(\d+(?:[.,]\d+)?)\s*['′]/);
    if(mn) return Math.round(parseFloat(mn[1].replace(',','.')));
    const n=s.match(/\d+/); return n?+n[0]:null;
  }
  const n=s.match(/\d+/); return n?+n[0]:null;
}
function repTop(e,raw){
  if(!e||e.type!=='reps'||e.u==='series') return null;
  const s=String(raw??'');
  if(/amrap|['′"″]/i.test(s)) return null;
  const nums=(s.match(/\d+/g)||[]).map(Number);
  return nums.length?Math.max(...nums):null;
}
function dose(id){

  let sets=pi[2];
  if(sessKey()==='d1'&&cicloWeek()===5&&!e.mob) sets=Math.max(1,Math.ceil(sets/2));
  return {v:pi[1],sets,reps:pi[3],rest:pi[4],note:pi[5],block:pi[6],target:parseTarget(id,pi[3]),top:repTop(e,pi[3])};
}
function shortVal(id,val){

function copySet(s){return {ex:s.ex,v:s.v||0,val:s.val,kg:s.kg??null,rpe:s.rpe??null}}
function pushSet(w,set){
  w.sets.push(set); ui.fresh=w.sets.length-1; const i=ui.fresh;
  if(!save()){w.sets.pop();ui.fresh=null;return false}
  ui.undo={op:'remove',date:w.date,index:i,set:copySet(set)};
  return true;
}
function removeSet(w,index){
  const set=w.sets[index]; if(!set) return false;
  const prev=copySet(set);
  w.sets.splice(index,1); ui.fresh=null;
  if(!save()){w.sets.splice(index,0,prev);return false}
  ui.undo={op:'insert',date:w.date,index,set:prev};
  return true;
}
function replaceSet(w,index,set){
  const prev=w.sets[index]; if(!prev) return false;
  const old=copySet(prev);
  w.sets[index]=set; ui.fresh=index;
  if(!save()){w.sets[index]=old;ui.fresh=null;return false}
  ui.undo={op:'replace',date:w.date,index,set:old};
  return true;
}

function ticksFor(id,v,n,sets){

  const kgTxt=pf.kg!=null?`, ${pf.kg} kg`:'';

    if(i<doneSets.length){
      const s=doneSets[i];
      html+=`<button type="button" class="tk on" data-act="untick" data-i="${s.i}" data-ex="${id}" aria-pressed="true" aria-label="Quitar el tilde de la serie ${i+1} de ${esc(e.name)}: ${s.val} ${unit(id,s.val)}${s.kg!=null?`, ${s.kg} kg`:''}">${tickFace(id,s.val,s.kg)}</button>`;
    }else{

      html+=`<button type="button" class="tk${next?' next':''}" data-act="quick" data-ex="${id}" data-v="${v}" aria-pressed="false" aria-label="${next?`Marcar la serie ${i+1}`:'Marcar la siguiente serie'} de ${esc(e.name)}: ${pf.val} ${unit(id,pf.val)}${kgTxt}">${tickFace(id,pf.val,pf.kg)}</button>`;

function chart(e,pts,m){
  const W=340,H=210,L=28,R=10,T=26,B=24,t0=+D(pts[0].date),t1=+D(pts.at(-1).date);
  const max=Math.max(1,...pts.map(m)),step=[1,2,5,10,20,50].find(s=>max*1.15/s<=5)||50,top=Math.max(step,Math.ceil(max*1.15/step)*step);
  const x=d=>L+(+D(d)-t0)/(t1-t0||1)*(W-L-R),y=v=>T+(1-v/top)*(H-T-B),c=v=>`var(--v${Math.min(v||0,3)})`;
  let g='';
  for(let v=0;v<=top;v+=step) g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const first=new Date(t0),months=[];
  for(let mm=new Date(first.getFullYear(),first.getMonth()+1,1);+mm<=t1;mm.setMonth(mm.getMonth()+1)) months.push(new Date(mm));
  months.forEach(mm=>{const xx=L+(+mm-t0)/(t1-t0||1)*(W-L-R);g+=`<text x="${xx}" y="${H-6}" text-anchor="middle">${MES[mm.getMonth()]}</text>`});
  g+=`<text x="${L}" y="${H-6}" text-anchor="start">${D(pts[0].date).getDate()} ${MES[first.getMonth()]}</text>`;
  let seen=pts[0].v||0,lastLbl=-99;
  pts.forEach(p=>{if((p.v||0)>seen){seen=p.v;const xx=x(p.date);g+=`<line x1="${xx}" x2="${xx}" y1="${T-6}" y2="${H-B}" stroke="${c(p.v)}" stroke-dasharray="3 4" stroke-width="1.5"/>`;
    if(xx-lastLbl>56){g+=`<text class="lbl" x="${Math.min(xx+4,W-R)}" y="${T-10}" text-anchor="${xx>W-70?'end':'start'}">${esc(e.vars[p.v]||'')}</text>`;lastLbl=xx}}});
  let seg=[pts[0]];
  const flush=()=>{if(seg.length>1)g+=`<polyline fill="none" stroke="${c(seg[0].v)}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${seg.map(p=>x(p.date)+','+y(m(p))).join(' ')}"/>`};
  pts.slice(1).forEach(p=>{if(p.v!==seg[0].v){flush();seg=[p]}else seg.push(p)});flush();
  pts.forEach((p,i)=>g+=`<circle class="mark" cx="${x(p.date)}" cy="${y(m(p))}" r="${i===ui.pt?7:4.8}" fill="${c(p.v)}"/>`);
  pts.forEach((p,i)=>g+=`<circle class="hit" data-act="pt" data-i="${i}" cx="${x(p.date)}" cy="${y(m(p))}" r="18"><title>${fShort(p.date)}: ${m(p)}</title></circle>`);
  return `<svg class="chart num" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso de ${esc(e.name)}">${g}</svg>`;
}

let tick=null;

  if(ui.sheet){if(commit&&elapsed>=1) ui.sheet.val=clampVal(elapsed);ui.sheet.timer=null}

function toggleTimer(){

  S.timer=Date.now(); renderSheet({preserve:true});
  const lf=lastFor(S.ex), target=(lf&&best(lf.sets).val)||S.val||60;

function toast(msg,ms=1800,withUndo=false){
  const t=document.getElementById('toast'); if(!t) return;
  if(!withUndo&&ui.undo&&ui.undo.op!=='replacdb') ui.undo=null;
  t.classList.toggle('can-undo',!!(withUndo&&ui.undo));
  t.replaceChildren();
  const holder=document.createElement('span');
  holder.innerHTML=I3('tick');
  const span=document.createElement('span');
  span.textContent=msg;
  if(holder.firstChild) t.append(holder.firstChild);
  t.append(span);
  if(withUndo&&ui.undo){const b=document.createElement('button');b.type='button';b.dataset.act='undo';b.textContent='Deshacer';t.append(b)}
  t.classList.add('on');
  clearTimeout(toast.t);
  const token=++toast.seq;
  toast.t=setTimeout(()=>{t.classList.remove('on');if(toast.seq===token&&ui.undo&&ui.undo.op!=='replacdb') ui.undo=null},ms);
}
toast.seq=0;
function progMsg(id){
  const d=dose(id), e=EXM[id]; if(!d||!e||e.mob||d.top==null) return null;
  const mine=(todayW()?.sets||[]).filter(s=>s.ex===id);
  if(mine.length<d.sets||!mine.every(s=>s.val>=d.top)) return null;
  const kg=Math.max(0,...mine.map(s=>s.kg||0));
  if(e.cap&&kg>=e.cap) return 'Estás en el máximo del equipo: bajada de 3-4", pausa de 2", a una pierna o más reps';
  return e.load?'Todas en el tope: la próxima vez, sube la carga mínima':'Todas en el tope: toca la siguiente progresión';
}

  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, S=ui.sheet;
  if(a!=='wipe'&&ui.wipeArm){ui.wipeArm=false;const wp=document.getElementById('wipe');if(wp) wp.textContent='Borrar todos los datos y empezar de cero'}
  switch(a){
    case 'tab':
      if(ui.view==='ex'&&el.dataset.v==='ejercicios'){history.back();break}
      if(ui.view===el.dataset.v){render({top:true});break}
      go(el.dataset.v); break;
    case 'ex': go('ex',{ex:el.dataset.ex,dv:null}); break;
    case 'pgo': go('progreso',{pex:el.dataset.ex,pt:null}); break;
    case 'pex': ui.pex=el.dataset.ex; ui.pt=null; render(); break;
    case 'pt': ui.pt=+el.dataset.i; render(); break;
    case 'dv': ui.dv=+el.dataset.v; render(); break;
    case 'sess':{const w=ensureToday();w.sess=el.dataset.v||null;if(!save())break;render({top:true});break}
    case 'especial':{const was=!!db.especial;const w0=todayW();const prevSess=w0?w0.sess:null;db.especial=was?0:1;
      const w=db.especial?ensureToday():w0;if(db.especial)w.sess='esp';else if(w&&w.sess==='esp')w.sess=null;
      if(!save()){db.especial=was?1:0;if(w)w.sess=prevSess;break}
      render({top:true});toast(db.especial?'Rutina especial activada':'Rutina quitada. Lo anotado sigue en el historial',2800);break}
    case 'back': history.back(); break;
    case 'mode':{db.mode=el.dataset.v==='kb'?'kb':'bar';if(!save())break;render();toast(db.mode==='kb'?'Modo kettlebell':'Modo barra');break}
    case 'untick':{const w=todayW();if(!w||!removeSet(w,+el.dataset.i))break;render();toast('Serie desmarcada',4000,true);break}
    case 'quick':{
      const id=el.dataset.ex, e=EXM[id]; if(!e) break;
      const pv=el.dataset.v!=null&&el.dataset.v!==''?+el.dataset.v:null;
      const pf=prefill(id,pv);
      if(e.load&&pf.kg==null){openSheet(id,null,pv);toast('Falta el peso de esta serie');break}
      if(!(pf.val>0)){openSheet(id,null,pv);break}
      const w=ensureToday();
      const set={ex:id,v:pf.v,val:clampVal(pf.val),kg:clampKg(pf.kg),rpe:null};
      if(!pushSet(w,set)) break;
      const n=w.sets.filter(s=>s.ex===id).length, d=dose(id), pm=progMsg(id);
      render(); if(d&&n===d.sets) cheer();
      toast(pm||`Serie ${n} de ${e.name.toLowerCase()}: ${set.val} ${unit(id,set.val)}${set.kg?` · ${set.kg} kg`:''}`,pm?4200:2200,true);
      break}
    case 'climb':{const w=ensureToday();w.climb=!w.climb;if(!save())break;render();break}
    case 'hipo':{db.hipo=db.hipo||[];const t=todayISO(),i=db.hipo.indexOf(t);
      if(i<0){db.hipo.push(t);if(!save()){db.hipo.pop();break}cheer();toast('Hipopresivos hechos')}
      else{db.hipo.splice(i,1);if(!save()){db.hipo.splice(i,0,t);break}toast('Hipopresivos desmarcados')}
      render();break}
    case 'add': openSheet(el.dataset.ex||null,null,el.dataset.v!=null&&el.dataset.v!==''?+el.dataset.v:null); break;
    case 'edit': openSheet(null,+el.dataset.i,null,el.dataset.date||null); break;
    case 'repeat':{const w=todayW();if(!w)break;const l=w.sets.filter(s=>s.ex===el.dataset.ex).at(-1);if(!l)break;
      if(!pushSet(w,copySet(l))) break;
      const n=w.sets.filter(s=>s.ex===l.ex).length,d=dose(l.ex);
      render(); if(d&&n===d.sets) cheer();
      toast(`Serie ${n} de ${EXM[l.ex].name.toLowerCase()} guardada`,2200,true);break}
    case 'close': closeSheet(); break;
    case 'pick': stopTimer(false);{const id=el.dataset.ex,pi=planItem(id);ui.sheet={date:todayISO(),ex:id,...prefill(id,pi?pi[1]:null),rpe:null,edit:null}} renderSheet(); break;
    case 'var': if(S){S.v=+el.dataset.v;renderSheet({preserve:true})} break;
    case 'inc': case 'dec':{if(!S)break;if(S.timer)stopTimer(true);const st=STEP[EXM[S.ex].type]||1;S.val=clampVal((+S.val||0)+(a==='inc'?st:-st));const i=document.getElementById('val');if(i)i.value=S.val;break}
    case 'kinc': case 'kdec':{if(!S)break;const n=(S.kg||0)+(a==='kinc'?1:-1);S.kg=n<=0?null:clampKg(n);const i=document.getElementById('kg');if(i)i.value=S.kg??'';break}
    case 'rpe': if(S){S.rpe=S.rpe===+el.dataset.v?null:+el.dataset.v;renderSheet({preserve:true})} break;
    case 'timer': toggleTimer(); break;
    case 'save':{if(!S)break;stopTimer(true);S.val=clampVal(S.val);S.kg=clampKg(S.kg);if(!(S.val>0)){toast('Pon al menos 1');break}
      const past=S.date!==todayISO();
      const w=past?wBy(S.date):ensureToday();
      if(!w){toast('No se pudo guardar');break}
      const set={ex:S.ex,v:S.v||0,val:S.val,kg:S.kg,rpe:S.rpe||null};
      const edited=S.edit!=null, ex=S.ex, date=S.date;
      const ok=edited?replaceSet(w,S.edit,set):pushSet(w,set);
      if(!ok) break;
      closeSheet();
      if(date===todayISO()) finishToday(ex,edited);
      else{ui.view='historial';ui.histOpen=date;render();toast(edited?'Serie actualizada':'Serie guardada',2500,true)}
      break}
    case 'del':{if(!S)break;const past=S.date!==todayISO();const w=past?wBy(S.date):todayW();const date=S.date,index=S.edit;
      if(!w||!removeSet(w,index))break;closeSheet();
      if(date===todayISO()) render(); else{ui.view='historial';ui.histOpen=date;render()}
      toast('Serie borrada',4000,true);break}
    case 'undo':{const u=ui.undo;if(!u)break;ui.undo=null;
      if(u.op==='replacdb'){db=u.prev;save();ui.view='hoy';render({top:true});toast('Datos recuperados');break}
      const w=db.workouts.find(x=>x.date===u.date);if(!w)break;
      if(u.op==='remove'&&w.sets[u.index]&&w.sets[u.index].ex===u.set.ex&&w.sets[u.index].val===u.set.val) w.sets.splice(u.index,1);
      else if(u.op==='insert') w.sets.splice(Math.min(u.index,w.sets.length),0,u.set);
      else if(u.op==='replace'&&w.sets[u.index]) w.sets[u.index]=u.set;
      save();render();toast('Cambio deshecho');break}
    case 'export': exportCopy(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'wipe':
      if(!ui.wipeArm){ui.wipeArm=true;render();break}
      ui.wipeArm=false;
      {const prev=structuredClone(db), mode=db.mode;
        db={workouts:[],hipo:[],v4:1}; if(mode) db.mode=mode;
        if(!save()){db=prev;toast('No se pudo borrar');break}
        ui.undo={op:'replacdb',prev}; ui.view='hoy'; render({top:true}); toast('Datos borrados',8000,true)}
      break;
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='val'&&ui.sheet){
    if(ui.sheet.timer) stopTimer(false);
    const raw=ev.target.value;
    if(raw===''||raw==='-'){ui.sheet.val=0;return}
    const n=clampVal(parseInt(raw,10)||0);
    ui.sheet.val=n;
    if(String(n)!==raw) ev.target.value=n;
  }
  if(ev.target.id==='kg'&&ui.sheet){
    const raw=String(ev.target.value).trim().replace(',','.');
    if(raw===''||raw==='-'||raw==='.'){ui.sheet.kg=null;return}
    if(raw.endsWith('.')) return;
    const k=parseFloat(raw);
    if(Number.isFinite(k)) ui.sheet.kg=clampKg(k);
  }
  if(ev.target.id==='note'){const w=ensureToday();w.note=ev.target.value;save()}
});
document.addEventListener('focusout',ev=>{
  if(ev.target.id==='kg'&&ui.sheet){ui.sheet.kg=clampKg(ui.sheet.kg);ev.target.value=ui.sheet.kg??''}
});
document.addEventListener('focusin',ev=>{
  if(ev.target.id==='val'||ev.target.id==='kg'){const el=ev.target;setTimeout(()=>{try{el.select()}catch(e){}},0)}
});
document.addEventListener('keydown',ev=>{
  if(ui.sheet&&ev.key==='Tab'){
    const f=[...document.querySelectorAll('#panel button, #panel input')];
    if(f.length){
      const first=f[0], last=f.at(-1);
      if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
      else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
    }
  }
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.prog li[data-act]')){ev.preventDefault();ev.target.click();return}
  if(ev.key==='Escape'&&ui.sheet){closeSheet();return}
  if(ev.key==='Enter'&&ui.sheet&&(ev.target.id==='val'||ev.target.id==='kg')){ev.preventDefault();document.querySelector('#panel [data-act=save]')?.click()}
});
document.getElementById('importFile').addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>importCopy(String(reader.result||''));
  reader.readAsText(file);
});
window.addEventListener('storage',ev=>{
  if(ev.key!==KEY||!ev.newValue||ui.sheet) return;
  try{const n=JSON.parse(ev.newValue);if(!n||!Array.isArray(n.workouts))return;db=n;seenRev=db.rev||0;render()}catch(e){}
});
window.addEventListener('resize',fitDock);
window.addEventListener('popstate',ev=>{
  if(ui.sheet) closeSheet();
  const st=ev.state||{}, h=location.hash.slice(1);
  ui.view=st.view||(['hoy','ejercicios','progreso','historial'].includes(h)?h:'hoy');
  if(st.ex) ui.ex=st.ex;
  if(st.pex) ui.pex=st.pex;
  render({top:true});
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
history.replaceState({view:ui.view,ex:ui.ex,pex:ui.pex},'',location.href);
render();
</script>

</html>
